<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Striver A2Z DSA Sheet</title>
    <link rel="preload" href="index.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="index.css" /></noscript>
    <link rel="stylesheet" href="https://unpkg.com/cal-heatmap/dist/cal-heatmap.css" />
    <script src="https://d3js.org/d3.v7.min.js" defer></script>
    <script src="https://unpkg.com/cal-heatmap/dist/cal-heatmap.min.js" defer></script>
    <script src="https://unpkg.com/@popperjs/core@2" defer></script>
    <script src="https://unpkg.com/cal-heatmap/dist/plugins/Tooltip.min.js" defer></script>
  </head>
  <body>
    <div class="wrap">
      <header class="site-header">
        <h1>Striver A2Z DSA Sheet</h1>
        <section class="global-progress" aria-label="Progress overview">
          <div class="progress global" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 solved of 0 (0%)">
            <div class="bar" style="width:0%"></div>
          </div>
          <div class="progress-text muted" role="status" aria-live="polite"></div>
        </section>
        <nav class="filters" aria-label="Quick filters and theme">
          <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true" aria-controls="content">All</button>
          <button type="button" class="filter-btn" data-filter="unsolved" aria-pressed="false" aria-controls="content">Unsolved</button>
          <button type="button" class="filter-btn" data-filter="solved" aria-pressed="false" aria-controls="content">Solved</button>
          <button type="button" id="theme-toggle" class="filter-btn theme-toggle" aria-pressed="false" aria-label="Toggle dark mode">🌙 Dark</button>
        </nav>
      </header>
      <section id="reviser" class="reviser" aria-label="DSA reviser">
        <div class="reviser-header">
          <div>
            <h2>Reviser</h2>
            <p class="muted">Spaced reminders: 1, 7, 30 days after solving.</p>
          </div>
          <div class="reviser-today">
            <span class="muted">Solved today</span>
            <strong data-heatmap-today>0</strong>
          </div>
        </div>
        <div class="card heatmap-card">
          <div class="heatmap-header">
            <h3>Last 30 days</h3>
            <div class="heatmap-legend muted">Darker means more solved</div>
          </div>
          <div class="reviser-heatmap" id="reviser-heatmap" aria-label="Problems solved heatmap"></div>
        </div>
        <div class="reviser-grid">
          <div class="card">
            <h3>Due Today</h3>
            <ul class="reviser-due"></ul>
          </div>
          <div class="card">
            <h3>Upcoming</h3>
            <ul class="reviser-upcoming"></ul>
          </div>
        </div>
      </section>
      <main id="content" aria-live="polite"></main>
    </div>
    <script type="module" src="./app.js"></script>
    <noscript>
      <p>Please enable JavaScript to view the data.</p>
    </noscript>
  </body>
</html>
