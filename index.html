<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Striver A2Z DSA Sheet</title>
    <link rel="preload" href="index.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="index.css" /></noscript>
  </head>
  <body>
    <div class="wrap">
      <header class="site-header">
        <h1>Striver A2Z DSA Sheet</h1>
        <div class="global-progress">
          <div class="progress global" aria-label="Overall progress">
            <div class="bar" style="width:0%"></div>
          </div>
          <div class="progress-text muted"></div>
        </div>
        <nav class="filters" aria-label="Quick filters">
          <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="filter-btn" data-filter="unsolved" aria-pressed="false">Unsolved</button>
          <button type="button" class="filter-btn" data-filter="solved" aria-pressed="false">Solved</button>
        </nav>
      </header>
      <div id="content"></div>
    </div>
    <script type="module" src="./app.js"></script>
    <noscript>
      <p>Please enable JavaScript to view the data.</p>
    </noscript>
  </body>
</html>
